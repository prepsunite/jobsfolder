<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jobsfolder – The ultimate placement intelligence operating system. Explore company hiring maps, practice OA questions, and read real interview experiences." />
    <title>Jobsfolder – Placement Intelligence Operating System</title>
    <!-- Google Fonts: Epilogue & Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('prepunite-theme');
          var oldDocTheme = localStorage.getItem('prepunite-doc-darkmode');
          if (theme === 'dark' || (!theme && oldDocTheme === 'true') || (!theme && !oldDocTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
