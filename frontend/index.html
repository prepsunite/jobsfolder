<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FD4A32" />

    <!-- SEO Meta Tags -->
    <title>PrepUnite – Placement Intelligence Operating System</title>
    <meta name="description" content="PrepUnite – Master campus placement drives with authentic memory-based OA papers, round patterns, aptitude question banks, and candidate interview experiences for TCS, Accenture, Amazon, Infosys, and 50+ companies." />
    <meta name="keywords" content="campus placements, OA papers, previous year papers, TCS NQT, Accenture ASE, Cognizant GenC, Infosys SP, aptitude questions, interview experiences, PrepUnite, Jobsfolder" />
    <link rel="canonical" href="https://prepunite.com/" />

    <!-- Open Graph / Social Media Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PrepUnite" />
    <meta property="og:url" content="https://prepunite.com/" />
    <meta property="og:title" content="PrepUnite – Placement Intelligence Operating System" />
    <meta property="og:description" content="Authentic campus recruitment OA papers, solved questions, and real interview experiences across 50+ hiring giants." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PrepUnite – Placement Intelligence Operating System" />
    <meta name="twitter:description" content="Authentic campus recruitment OA papers, solved questions, and real interview experiences across 50+ hiring giants." />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Fonts: Cabinet Grotesk, General Sans, Syne, Space Grotesk & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700,800,900&f[]=general-sans@400,500,600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('prepunite-theme');
          var oldDocTheme = localStorage.getItem('prepunite-doc-darkmode');
          if (theme === 'dark' || (!theme && oldDocTheme === 'true') || (!theme && !oldDocTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
